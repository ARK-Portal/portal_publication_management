# This workflow runs at midnight (00:00) every day to execute 
# utils/monitor.py and update VEOIBD_file_monitoring_report.log
# then commit updates to the repo

name: monthly-queries-cron

on:
  schedule:
    # automatically run on the first day of the month at midnight PDT
    - cron: '0 7 1 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'The commit message to use'
        required: true
        default: 'Manual update via workflow_dispatch'

jobs:
  build:
    name: workflow env configuration
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
    
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
      # Set up supported python.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.19' 

      - name: Install Python Packages
        run: |
          pip install -r requirements.txt

      - name: Run monitoring script
        run: |
          python main.py

      - name: Determine if any files have changed
        id: changes
        run: |
            if git diff --quiet latest.log; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No changes detected after running main.py. Nothing to commit."
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Changes detected after running main.py and will be commited to query-results branch."
            fi

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
         github_token: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
         branch: 'query-results'
         force: true

      - name: Submit PR of query-results changes into main
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
          commit-message: "${{ github.event.inputs.commit_message || 'commit results of monthly-queries-cron workflow' }}"
          title: "Update ARK Portal Publications"
          body: "This PR was automatically created by a GitHub Action. Review is required before merging"
          delete-branch: false
          branch: "query-results" # The new branch to create
          base: "main" # The branch to merge into
          assignees: jmvera255
          reviewers: jmvera255
