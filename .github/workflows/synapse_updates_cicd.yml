# this workflow is used to executed Synapse activity if new pubs are 
# identified or if updates are needed

name: synapse_updates_cicd

on:
  push:
    branches: [main]
    paths: 
      - 'publication_updates.csv'
      - 'new_publications.csv'
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'The commit message to use'
        required: true
        default: 'Manual execution via workflow_dispatch'

jobs:
  build:
    name: update Synapse backed project
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
      SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
    
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.ARK_CICD_SERVICE_ACCOUNT }}
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
      # Set up supported python.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10.19'

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          new:
            - 'new_publications.csv'
          updates:
            - 'publication_updates.csv'

      - name: Install Python Packages
        run: |
          pip install "synapseclient[pandas]"

    # run only if 'new' files were changed
    - name: Create new publication link entities
      if: steps.filter.outputs.new == 'true'
      run: |
        python new_pub_entities.py && echo 'New publications created!'

    # run only if 'updates' files were changed
    - name: Create new publication link entities
      if: steps.filter.outputs.updates == 'true'
      run: |
        python update_publications.py && 'Publications updated!'

# END